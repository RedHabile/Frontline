name: Patch Frontline invasion
on:
  push:
    paths:
      - .github/patch_front.py
      - .github/workflows/front_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply invasion patch
        run: python3 .github/patch_front.py
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve full-front invasion speed [front-patch]" || exit 0
          git push
